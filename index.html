<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game">
        <div id="day">
            Day 1
        </div>

        <div id="status">
            <div class="status-item">
                <span class="status-name">好感度</span>
                <span class="status-colon">：</span>
                <span id="affection-value" class="status-value"></span>
            </div>

            <div class="status-item">
                <span class="status-name">SAN</span>
                <span class="status-colon">：</span>
                <span id="san-value" class="status-value"></span>
            </div>
        </div>

        <div id="story">
            <p id="story-text"></p>
        </div>

        <div id="choices"></div>

        <button id="next-button">繼續</button>
        <button id="restart-button">↻</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
